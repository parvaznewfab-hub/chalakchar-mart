name: chalakchar_mart
description: "ChalakChar Mart App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # 🔥 Firebase (Updated to latest versions for web 1.0.0 support)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.5
  file_picker: ^8.0.0
  csv: ^5.0.2
  flutter_speed_dial: ^7.0.0
  web: ^1.0.0
  universal_html: ^2.2.4
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  open_filex: ^4.7.0
  pdf: ^3.11.1
  printing: ^5.14.3
  intl: ^0.18.1
  introduction_screen: ^3.1.12
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.2.0
  esc_pos_utils_plus: ^2.0.4
  esc_pos_printer_plus: ^0.1.1
  carousel_slider: ^5.0.0
  photo_view: ^0.15.0
  youtube_player_iframe: ^5.1.2
  share_plus: ^10.1.4
  vector_math: ^2.1.4
  http: ^1.2.2
  firebase_auth_platform_interface: ^7.7.3

  # 📷 Image picker
  image_picker: ^1.1.2

  # 🔔 Local notifications
  flutter_local_notifications: ^17.2.1

  # 🌐 URL launcher
  url_launcher: ^6.3.0

  # 📊 Charts
  fl_chart: ^0.69.0

  # 🍎 iOS icons
  cupertino_icons: ^1.0.8

  # 📄 Rich HTML rendering (AliExpress product description)
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
